<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fiolet: рецепты с КБЖУ</title>
<meta name="description" content="Рецепты Fiolet с КБЖУ: быстрые завтраки, ужины и ПП. Порции, список покупок и режим готовки с таймером.">
<meta property="og:title" content="Fiolet: рецепты с КБЖУ">
<meta property="og:description" content="Быстрые завтраки, ужины и ПП. Порции, список покупок и режим готовки с таймером.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#3E2A3C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap&subset=cyrillic">
<style>
:root{--paper:#F6F1EE;--oats:#EFE3D3;--ink:#2A2320;--soft:#6B5F58;--accent:#6B4C63;--deep:#3E2A3C;--asoft:#E7DAE1;--line:#DED2C9;--stage:#E9E3DD}
*{box-sizing:border-box}
body{margin:0;background:var(--stage);font-family:Montserrat,system-ui,sans-serif;color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:32px 14px 90px}
h1{font-size:30px;font-weight:800;margin:0 0 8px}
h2{font-size:24px;font-weight:800;margin:0 0 6px}
.lead{font:400 16px/1.5 'PT Serif',Georgia,serif;color:var(--soft);max-width:740px;margin:0}
.jump{display:flex;gap:10px;margin:18px 0 0;flex-wrap:wrap}
.jump a{border:1px solid var(--accent);color:var(--accent);border-radius:20px;padding:7px 16px;font-size:13px;font-weight:700;text-decoration:none}
.sec{margin-top:56px;padding-top:26px;border-top:1px solid var(--line)}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.entries{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:18px 0 0;max-width:820px}
.entries div{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font:400 14px/1.45 'PT Serif',Georgia,serif;color:var(--soft)}
.entries b{display:block;font:700 13px Montserrat;color:var(--ink);margin-bottom:4px}

.phone{width:min(375px,100%);height:760px;background:var(--paper);border:9px solid #2A2320;border-radius:42px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.pbody{flex:1;overflow-y:auto;position:relative}
.pbody::-webkit-scrollbar{display:none}
.tabbar{flex:none;display:flex;border-top:1px solid var(--line);background:var(--paper);padding-bottom:6px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 4px;font-size:11px;font-weight:600;color:var(--soft);position:relative}
.tabbar button.on{color:var(--accent)}
.tabbar em{position:absolute;top:4px;left:calc(50% + 6px);background:var(--accent);color:var(--paper);font:700 10px Montserrat;border-radius:9px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.tag{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin:22px 0 6px}
.ttl{font-size:29px;font-weight:800;line-height:1.08;margin:8px 0 14px}
.kbn{font-size:12px;color:var(--soft);margin:0 0 8px}
.tot{display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px;background:var(--asoft);border-radius:14px;padding:9px 12px;margin:0 0 8px;font-size:12px;color:var(--deep)}
.tot span{flex:1 0 100%;font-weight:600}
.tot b{font-size:15px;font-weight:800}
.tot i{font-style:normal;font-weight:700}
.tmr{position:absolute;left:50%;transform:translateX(-50%);bottom:68px;z-index:9;display:flex;align-items:center;gap:8px;background:var(--deep);color:var(--paper);border-radius:22px;padding:6px 6px 6px 14px;font:700 13px Montserrat;white-space:nowrap;cursor:pointer}
.tmr.ck{bottom:84px;background:#2A1B29;border:1px solid var(--asoft)}
.tmr small{font:500 11px Montserrat;color:var(--asoft);max-width:110px;overflow:hidden;text-overflow:ellipsis}
.tmr button{width:22px;height:22px;border-radius:50%;background:rgba(246,241,238,.18);display:flex;align-items:center;justify-content:center;flex:none}
.tmr.done{background:var(--accent)}

.C-home{padding:22px 18px 24px}
.mast{display:flex;justify-content:space-between;align-items:baseline}
.mast b{font-size:38px;font-weight:800;letter-spacing:-.02em}
.mast span{font-size:13px;color:var(--soft);font-weight:600}
.search{display:flex;align-items:center;gap:8px;margin-top:12px;border:1px solid var(--line);border-radius:22px;padding:9px 14px;background:#FBF8F5;color:var(--soft)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:14px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:14px 0 16px}
.chip{border:1px solid var(--line);border-radius:16px;padding:7px 8px;font-size:12px;font-weight:600}
.chip.on{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.hero{border-radius:20px;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;background:var(--deep);color:var(--paper);cursor:pointer}
.hero small{color:var(--asoft);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:11px}
.hero h5{font-size:21px;font-weight:800;line-height:1.1;margin:6px 0 4px}
.hero p{margin:0;font-size:13px;color:var(--asoft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tl{border-radius:20px;padding:12px;font-weight:800;font-size:15px;line-height:1.2;position:relative;cursor:pointer}
.tl small{display:block;font:500 12px Montserrat;color:var(--soft);margin-top:4px}
.tl .im{display:flex;justify-content:center;margin-bottom:6px}
.tl.wide{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding-right:56px}
.tl.wide .im{margin:0}
.fv{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;background:rgba(246,241,238,.88);display:flex;align-items:center;justify-content:center;color:var(--accent);z-index:1}
.tl.wide .fv{top:50%;margin-top:-15px}
.fv.on svg{fill:var(--accent)}
.empty{text-align:center;padding:40px 10px;color:var(--soft)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.empty span{font:400 14px/1.4 'PT Serif',Georgia,serif}

.C-hero{height:290px;display:flex;align-items:center;justify-content:center;position:relative}
.rb{position:absolute;top:16px;width:38px;height:38px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.rb.l{left:16px}
.rb.r1{right:16px}
.rb.r2{right:60px}
.rb.on svg{fill:var(--accent);color:var(--accent)}
.chipt{position:absolute;left:20px;bottom:44px;background:var(--paper);border-radius:14px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--accent)}
.C-body{background:var(--paper);border-radius:28px 28px 0 0;margin-top:-28px;padding:26px 22px 30px;position:relative}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 8px}
.tiles div{background:var(--oats);border-radius:14px;padding:10px 4px;text-align:center}
.tiles b{display:block;font-size:20px;font-weight:800}
.tiles span{font-size:11px;font-weight:600;color:var(--soft)}
.vid{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--accent);color:var(--accent);border-radius:22px;padding:9px 16px;font:700 13px Montserrat;text-decoration:none;margin:2px 0 6px}
.ctl{display:flex;gap:10px;margin:10px 0 4px}
.pill{flex:1.3;border:1px solid var(--line);border-radius:22px;padding:7px 8px 7px 12px;display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:13px;font-weight:600;min-width:0}
.pill .sp{display:flex;align-items:center;gap:7px}
.pill .sp button{width:20px;height:20px;border-radius:50%;border:1px solid var(--accent);color:var(--accent);font:700 12px/1 Montserrat;display:flex;align-items:center;justify-content:center;padding:0}
.btn{flex:1;background:var(--accent);color:var(--paper);border-radius:22px;padding:10px 12px;font:700 13px Montserrat;display:flex;align-items:center;justify-content:center;gap:7px;text-align:center}
.btn.out{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn2{width:100%;border:1px dashed var(--accent);color:var(--accent);border-radius:16px;padding:11px;font:700 13px Montserrat;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px}
.btn2.ok{border-style:solid;background:var(--asoft)}
.ig{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font:400 16px/1.25 'PT Serif',Georgia,serif;cursor:pointer}
.ig .bx{width:20px;height:20px;border:2px solid var(--accent);border-radius:5px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font:700 13px Montserrat}
.ig .q{font:700 13px Montserrat;color:var(--accent);width:78px;flex:none}
.ig.done{color:#9A8F88;text-decoration:line-through}
.ig.done .bx{background:var(--accent)}
.ig.done .bx::after{content:'✓'}
.ig small{display:block;font:500 11px Montserrat;color:var(--soft);text-decoration:none}
.stp{list-style:none;margin:0;padding:0;counter-reset:s}
.stp li{counter-increment:s;display:flex;gap:12px;font:400 16px/1.45 'PT Serif',Georgia,serif;margin-bottom:12px}
.stp li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--asoft);color:var(--deep);font:700 13px Montserrat;display:flex;align-items:center;justify-content:center}
.promo{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:10px;background:#FBF8F5;cursor:pointer}
.promo b{display:block;font-size:13px}
.promo span{font-size:12px;color:var(--soft)}
.promo.tg{background:var(--deep);color:var(--paper);border-color:var(--deep)}
.promo.tg span{color:var(--asoft)}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:124px;background:var(--ink);color:var(--paper);border-radius:18px;padding:9px 16px;font-size:13px;font-weight:600;white-space:nowrap;z-index:20}
.sbg{position:absolute;inset:0;background:rgba(42,35,32,.5);z-index:10}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:24px 24px 0 0;padding:12px 20px 22px;z-index:11}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sh-t{font-size:18px;font-weight:800;margin-bottom:12px}
.og{display:flex;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.og-i{width:112px;display:flex;align-items:center;justify-content:center;flex:none}
.og-t{padding:10px 12px;font-size:12px;color:var(--soft);display:flex;flex-direction:column;gap:3px;min-width:0}
.og-t b{font-size:14px;color:var(--ink);line-height:1.2}
.url{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:14px;padding:9px 12px;margin-top:12px;font-size:12px;color:var(--soft);background:#FBF8F5}
.url span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.url button{flex:none;color:var(--accent);font:700 12px Montserrat;display:flex;align-items:center;gap:5px}
.note{font:italic 400 12px/1.4 'PT Serif',Georgia,serif;color:var(--soft);margin:8px 0 12px}
.sh-b{display:flex;gap:10px}
.cook{background:var(--deep);color:var(--paper);flex:1;display:flex;flex-direction:column;padding:20px 22px 24px}
.ck-top{display:flex;justify-content:space-between;align-items:center}
.ck-top .rb{position:static;background:rgba(246,241,238,.14);color:var(--paper)}
.awake{font-size:12px;font-weight:700;color:var(--asoft);border:1px solid rgba(231,218,225,.4);border-radius:14px;padding:5px 12px}
.ck-prog{display:flex;gap:5px;margin:20px 0 10px}
.ck-prog i{flex:1;height:4px;border-radius:2px;background:rgba(246,241,238,.2)}
.ck-prog i.on{background:var(--asoft)}
.ck-n{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--asoft)}
.ck-t{font:400 27px/1.35 'PT Serif',Georgia,serif;margin:22px 0 18px;flex:1}
.timer{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;border:1px solid var(--asoft);color:var(--asoft);border-radius:22px;padding:9px 16px;font:700 14px Montserrat;margin-bottom:18px}
.testt{align-self:flex-start;font:600 12px Montserrat;color:var(--asoft);text-decoration:underline;margin:-6px 0 16px}
.ck-b{display:flex;gap:10px}
.ck-b .btn{background:var(--paper);color:var(--deep);padding:14px}
.ck-b .btn.out{background:transparent;color:var(--paper);border-color:var(--asoft)}
.ck-b .btn[disabled]{opacity:.35}
.lhead{padding:22px 18px 6px}
.lhead b{font-size:26px;font-weight:800;display:block}
.lhead span{font-size:13px;color:var(--soft)}
.lbody{padding:6px 18px 24px}
.fcard{display:flex;align-items:center;gap:12px;border-radius:18px;padding:10px 14px 10px 10px;margin-bottom:10px;cursor:pointer;font-weight:800;font-size:15px;line-height:1.2}
.fcard small{display:block;font:500 12px Montserrat;color:var(--soft);margin-top:3px}
.pintro{padding:0 18px 12px;font:400 14px/1.45 'PT Serif',Georgia,serif;color:var(--soft)}
.lvs{display:flex;gap:6px;align-items:center;justify-content:inherit;margin-top:10px;font:600 12px Montserrat;color:var(--soft)}
.lvs i{font-style:normal;background:var(--oats);color:var(--ink);border-radius:12px;padding:4px 9px}
.plist{display:grid;gap:12px;padding:4px 18px 24px}
.pcard{display:flex;align-items:center;gap:14px;border-radius:20px;background:var(--oats);padding:14px 16px;cursor:pointer}
.pcard b{display:block;font-size:17px;font-weight:800}
.pcard small{display:block;font:500 12px Montserrat;color:var(--soft);margin-top:3px}
.pcard .lvs i{background:var(--paper)}
.pic{display:flex;flex:none}
.pic svg+svg{margin-left:-16px}
.plback{font:600 13px Montserrat;color:var(--accent);margin:0 0 6px;padding:0}
.seg{display:flex;align-items:center;gap:6px;padding:4px 18px 12px}
.seg button{flex:1;border-radius:14px;background:var(--oats);padding:11px 0;font:700 15px Montserrat;color:var(--soft)}
.seg button.on{background:var(--accent);color:var(--paper)}
.seg em{font:600 12px Montserrat;font-style:normal;color:var(--soft);margin-left:4px}
.ptot{margin:0 18px 14px;border-radius:16px;background:var(--asoft);padding:12px 14px;font:600 13px Montserrat}
.ptot b{font-size:18px;font-weight:800;margin-right:10px}
.ptot i{font-style:normal;margin-right:10px}
.ptot span{display:block;font:400 12px Montserrat;color:var(--soft);margin-top:4px}
.pdish{padding:0 18px 24px}
.wplans{max-width:980px;margin:0 auto;padding:0 28px 30px}
.wplans .lhead,.wplans .pintro,.wplans .plist,.wplans .pdish{padding-left:0;padding-right:0}
.wplans .seg{padding-left:0;padding-right:0;max-width:420px}
.wplans .ptot{margin-left:0;margin-right:0;max-width:420px}
.wplans .empty{text-align:left;padding:18px 0}
.app.wide .plist{grid-template-columns:repeat(2,1fr)}
.clr{margin:14px auto 0;display:block;font:700 13px Montserrat;color:var(--accent)}

.reel{flex:1;background:#2A2320;position:relative;display:flex;flex-direction:column}
.reel-v{flex:1;display:flex;align-items:center;justify-content:center;background:#5A4152;margin:0}
.reel-sub{position:absolute;left:0;right:0;top:60%;text-align:center;color:#fff;font:800 30px/1.15 Montserrat;text-shadow:0 2px 8px rgba(0,0,0,.45)}
.reel-cta{position:absolute;left:18px;right:18px;bottom:26px;background:rgba(42,35,32,.78);color:#fff;border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.35}
.reel-cta b{display:block;font-size:14px}
.reel-rail{position:absolute;right:14px;bottom:130px;display:flex;flex-direction:column;gap:16px;color:#fff}

.story{display:flex;flex-wrap:wrap;gap:30px 26px;padding:18px 4px 12px}
.st1{flex:none;width:270px;scroll-snap-align:start}
.sn{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-weight:800;font-size:15px}
.sn b{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--paper);display:flex;align-items:center;justify-content:center;font-size:13px}
.miniw{width:270px;height:548px;position:relative}
.mini{width:375px;height:760px;transform:scale(.72);transform-origin:0 0;pointer-events:none;position:absolute;left:0;top:0}
.mini .phone{width:375px}
.sd{font:400 14px/1.45 'PT Serif',Georgia,serif;color:var(--soft);margin:12px 0 0}
.proto{display:flex;gap:36px;flex-wrap:wrap;align-items:flex-start;margin-top:22px}
.hints{flex:1;min-width:240px;max-width:420px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.hints b{display:block;font-size:15px;margin-bottom:8px}
.hints ol{margin:0;padding-left:20px;font:400 15px/1.5 'PT Serif',Georgia,serif;color:var(--soft)}
.hints li{margin-bottom:6px}
.rst{margin-top:10px;border:1px solid var(--accent);color:var(--accent);border-radius:18px;padding:6px 14px;font:700 12px Montserrat}
.devbox{margin-top:30px}
.cap{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin:0 0 10px}
.fitw{overflow:hidden;border-radius:12px}
.fitin{transform-origin:0 0;display:block;width:max-content}

.browser{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;width:1200px}
.bbar{display:flex;align-items:center;gap:7px;padding:10px 14px;background:#E9E3DD;border-bottom:1px solid var(--line)}
.bbar i{width:11px;height:11px;border-radius:50%;background:#CFC4BB}
.bbar .url2{margin-left:12px;flex:1;max-width:420px;background:var(--paper);border-radius:14px;padding:5px 14px;font-size:12px;color:var(--soft)}
.site{background:var(--paper);color:var(--ink)}
.dsk{width:1198px;height:740px;overflow:hidden}
.sh{display:flex;align-items:center;gap:28px;padding:16px 40px;border-bottom:1px solid var(--line)}
.sh .logo{font-size:28px;font-weight:800;letter-spacing:-.02em}
.sh nav{display:flex;gap:22px;font-size:14px;font-weight:600;color:var(--soft)}
.sh nav .on{color:var(--ink);border-bottom:2px solid var(--accent);padding-bottom:4px}
.sh nav em,.th2 nav em{font:700 10px Montserrat;font-style:normal;background:var(--accent);color:var(--paper);border-radius:9px;padding:2px 6px;margin-left:4px}
.th2 nav .on{color:var(--ink);border-bottom:2px solid var(--accent);padding-bottom:4px}
.sh .search{margin:0 0 0 auto;width:300px}
.dmain{display:grid;grid-template-columns:220px 1fr;gap:36px;padding:30px 40px 44px}
.side .item{display:flex;justify-content:space-between;padding:9px 12px;border-radius:12px;font-size:14px;font-weight:600;margin-bottom:2px}
.side .item.on{background:var(--accent);color:var(--paper)}
.side .item span{opacity:.7}
.dhero{display:flex;align-items:center;justify-content:space-between;gap:20px;background:var(--deep);color:var(--paper);border-radius:24px;padding:20px 36px;margin-bottom:16px}
.dhero small{color:var(--asoft);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px}
.dhero h3{font-size:34px;font-weight:800;line-height:1.1;margin:8px 0}
.dhero p{margin:0 0 14px;color:var(--asoft)}
.dhero .btn{flex:none;background:var(--paper);color:var(--deep);display:inline-flex;padding:10px 22px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.drec{display:grid;grid-template-columns:340px 1fr;gap:36px;padding:24px 40px 0}
.drec .bigimg{height:200px}
.bigimg{height:320px;border-radius:24px;display:flex;align-items:center;justify-content:center;position:relative}
.bigimg .chipt{bottom:18px}
.crumb{font-size:12px;color:var(--soft);font-weight:600;margin-bottom:14px}
.drec .ttl{font-size:34px;margin:6px 0 4px}
.acts{display:flex;gap:10px;align-items:center;margin:4px 0 6px}
.rbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.trow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:20px}
.more{display:flex;align-items:center;gap:8px;margin-top:18px;font-size:12px;font-weight:700;color:var(--soft)}
.promos{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.g4{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tfr{background:#2A2320;padding:14px;border-radius:30px;width:max-content}
.tabsite{width:820px;height:880px;border-radius:18px;overflow:hidden}
.th2{display:flex;align-items:center;gap:20px;padding:16px 28px;border-bottom:1px solid var(--line)}
.th2 .logo{font-size:26px;font-weight:800;letter-spacing:-.02em}
.th2 .search{margin:0 0 0 auto;width:250px}
.tbody{padding:22px 28px 30px}
.g3t{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.trec{display:grid;grid-template-columns:300px 1fr;gap:28px}
.trec .bigimg{height:250px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:6px}
.only .wrap>h1,.only .wrap>.lead,.only .jump{display:none}
.only .sec{margin-top:0;border-top:0}
.only .story{flex-wrap:wrap;overflow:visible}
@media (max-width:520px){.wrap{padding:24px 10px 80px}h1{font-size:25px}}

html,body{margin:0}
body{background:var(--paper)}
#phone.app{display:block;min-height:100vh;min-height:100dvh;background:var(--paper);position:relative;padding-bottom:72px}
.app .pbody{overflow:visible}
.app .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding-bottom:max(6px,env(safe-area-inset-bottom))}
.app .tmr{position:fixed;bottom:80px;z-index:35}
.app .tmr.ck{bottom:100px}
.app .toast{position:fixed;bottom:136px;z-index:60}
.app .sbg{position:fixed;inset:0;z-index:50}
.app .sheet{position:fixed;left:50%;right:auto;bottom:0;transform:translateX(-50%);width:min(100%,520px);z-index:51;padding-bottom:max(22px,env(safe-area-inset-bottom))}
.app .cook{position:fixed;inset:0;z-index:40;padding-left:max(22px,calc((100vw - 640px)/2));padding-right:max(22px,calc((100vw - 640px)/2))}
.testt{display:none}
.rmx{margin-left:auto;flex:none;width:30px;height:30px;border-radius:50%;color:var(--soft);font:400 22px/1 Montserrat;display:flex;align-items:center;justify-content:center;padding:0}
.vvb{margin:14px 0 4px;background:var(--accent);color:var(--paper);border-style:solid}
.vvl{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;background:#FBF8F5}
.vvl.off{opacity:.5}
.vvh{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;cursor:pointer}
.vvh .bx{width:18px;height:18px;border:2px solid var(--accent);border-radius:5px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font:700 12px Montserrat}
.vvh .bx.on2{background:var(--accent)}
.vvh .bx.on2::after{content:'✓'}
.vvp{font:400 15px/1.3 'PT Serif',Georgia,serif;margin:8px 0 2px}
.vvn{font-size:12px;color:var(--soft)}
.vvc{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;flex-wrap:wrap}
.vvc .sw{color:var(--accent);font:700 12px Montserrat;text-decoration:underline}
.vvst{display:flex;align-items:center;gap:6px;font-size:13px}
.vvst button{width:22px;height:22px;border-radius:50%;border:1px solid var(--accent);color:var(--accent);font:700 13px/1 Montserrat;display:flex;align-items:center;justify-content:center;padding:0}
.vvtot{display:flex;justify-content:space-between;font-weight:800;font-size:16px;margin:12px 0 0}
.vvwarn{font:italic 400 12px/1.4 'PT Serif',Georgia,serif;color:var(--soft);margin:8px 0 0}
.app.wide{padding-bottom:0}
.app.wide .tabbar{display:none}
.app.wide .tmr{bottom:24px}
.app.wide .toast{bottom:80px}
.shw{border-bottom:1px solid var(--line)}
.shw .sh{max-width:1240px;margin:0 auto;border-bottom:0}
.sh .logo{font-size:28px;font-weight:800;letter-spacing:-.02em}
.sh nav{display:flex;gap:22px;align-items:center}
.sh nav button,.sh nav a{font-size:14px;font-weight:600;color:var(--soft);text-decoration:none;padding-bottom:4px;border-bottom:2px solid transparent}
.sh nav .on{color:var(--ink);border-bottom-color:var(--accent)}
.wmain{max-width:1240px;margin:0 auto;padding:0 40px}
.wh{display:grid;grid-template-columns:220px 1fr;gap:36px;padding:20px 0 24px}
.side .item{width:100%}
.wchips{display:none}
@media (min-width:1000px){.wh .g3{grid-template-columns:repeat(4,minmax(0,1fr))}}
.wr{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px 24px;padding:16px 0}
.w-media{grid-column:1/5;grid-row:1;height:140px;border-radius:24px;display:flex;align-items:center;justify-content:center;position:relative}
.w-media .chipt{bottom:12px;left:14px}
.w-head{grid-column:5/13;grid-row:1}
.w-kb{grid-column:1/5;grid-row:2;align-self:start}
.w-ing{grid-column:5/9;grid-row:2/5}
.w-steps{grid-column:9/13;grid-row:2/5}
.w-promos{grid-column:1/5;grid-row:3;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-self:start}
.w-promos .promo{padding:10px 12px;align-items:flex-start}
.w-more{grid-column:1/5;grid-row:4;display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:12px;font-weight:700;color:var(--soft);align-self:start}
.wr .ig{padding:6px 0;font-size:15px}
.wr .ig .bx{width:18px;height:18px}
.wr .stp li{font-size:15px;line-height:1.4;margin-bottom:8px}
.wr .btn2{margin-top:10px;padding:9px}
.wr .ttl{font-size:34px;margin:6px 0 4px}
.wr .crumb button{color:var(--soft);font-weight:600}
.rbtn.on svg{fill:var(--accent)}
.wcol{max-width:560px;margin:0 auto;padding-bottom:30px}
@media (max-width:999px){
.shw .sh{padding:14px 28px;gap:20px}
.sh .search{width:230px}
.wmain{padding:0 28px}
.wh{grid-template-columns:1fr;padding-top:20px}
.side{display:none}
.wchips{display:flex}
.w-media{grid-column:1/5;grid-row:1/3;height:auto;min-height:230px}
.w-head{grid-column:5/13;grid-row:1}
.w-kb{grid-column:5/13;grid-row:2}
.w-ing{grid-column:1/7;grid-row:3}
.w-steps{grid-column:7/13;grid-row:3}
.w-promos{grid-column:1/13;grid-row:4}
.w-more{grid-column:1/13;grid-row:5}
.wr .ttl{font-size:28px}
}
</style>
</head>

    case 'chk':{const k=S.rid+':'+id;S.chk[k]=!S.chk[k];break}
    case 'lchk':S.chk['L:'+id]=!S.chk['L:'+id];break;
    case 'addList':{const sk=get(S.rid).ings.map((_,i)=>S.chk[S.rid+':'+i]?i:-1).filter(i=>i>=0);S.list[S.rid]={p:S.n,skip:sk,pl:S.pctx?S.plan:null,lv:S.lvl};msg=sk.length?'Добавлено, без '+sk.length+' '+plu(sk.length,['вычеркнутого','вычеркнутых','вычеркнутых']):'Добавлено в список покупок';break}
    case 'clearList':S.list={};Object.keys(S.chk).forEach(k=>{if(k.startsWith('L:'))delete S.chk[k]});break;
    case 'cook':S.screen='cook';S.step=0;break;
    case 'exitCook':S.screen='recipe';break;
    case 'nextStep':if(S.step>=get(S.rid).steps.length-1){S.screen='recipe';msg='Приятного аппетита'}else S.step++;break;
    case 'prevStep':S.step=Math.max(0,S.step-1);break;
    case 'timer':{clearInterval(tm);arm();const r=get(S.rid),secs=Math.round(Number(id)*60);T={end:Date.now()+secs*1000,left:secs,rid:S.rid,step:S.step,name:r.sh||r.t,done:false};schedRing(secs);tm=setInterval(tick,1000);break}
    case 'timerOff':clearInterval(tm);cancelRing();T=null;break;
    case 'resume':S.rid=T.rid;S.step=T.step;S.screen='cook';S.sheet=false;break;
    case 'share':S.sheet=true;S.copied=false;break;
    case 'closeSheet':S.sheet=false;break;
    case 'copy':S.copied=true;break;
    case 'pdf':msg='Здесь скачается PDF-сборник';break;
    case 'tgshare':msg='Откроется Telegram';break;
  }
  save();render();if(msg)toast(msg);
}
root.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;e.preventDefault();act(el)});
root.addEventListener('input',e=>{if(e.target.classList.contains('js-q')){S.q=e.target.value;root.querySelector('.js-grid').innerHTML=gridHTML(S)}});
load();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(T)tick();wake(S.screen==='cook'||(T&&!T.done))}});
document.addEventListener('pointerdown',()=>{if(T&&!T.done&&!AC){arm();schedRing(remain())}});
document.getElementById('resetP').onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}location.reload()};
render();

</script>
</body>
